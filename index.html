<style id="rx-style">
/* Layout: dark charcoal showroom, one silver "route" line (dashed road centerline) tying sections together; logo disc leads the hero. Admin screen reuses the same tokens. */
:root {
  --bg: #090b10;
  --surface: rgba(255, 255, 255, .065);
  --surface-2: rgba(255, 255, 255, .10);
  --input-bg: rgba(255, 255, 255, .07);
  --band: rgba(255, 255, 255, .035);
  --nav-bg: rgba(10, 12, 18, .58);
  --line: rgba(255, 255, 255, .14);
  --fg: #eef1f5;
  --muted: #a3acb8;
  --silver: #cdd2db;
  --road: #7fa8d1;
  --btn-bg: #e9ecf1;
  --btn-fg: #0d1016;
  --wa: #25a05a;
  --warn: #e8ae5e;
  --glow1: rgba(86, 132, 190, .38);
  --glow2: rgba(205, 210, 219, .10);
  --glow3: rgba(70, 96, 150, .30);
  --blur: 18px;
  --glass-shadow: 0 10px 34px rgba(0, 0, 0, .38);
  --glass-hi: inset 0 1px 0 rgba(255, 255, 255, .12);
  --font-display: "Cairo", "Segoe UI", Tahoma, sans-serif;
  --font-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
  --font-latin: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e8ecf2; --surface: rgba(255, 255, 255, .58); --surface-2: rgba(255, 255, 255, .78);
    --input-bg: rgba(255, 255, 255, .82); --band: rgba(255, 255, 255, .35); --nav-bg: rgba(238, 241, 246, .66);
    --line: rgba(30, 45, 80, .13); --fg: #12161c; --muted: #4f5a6a; --silver: #3a4350; --road: #2b5f95;
    --btn-bg: #12161c; --btn-fg: #eef1f5; --wa: #1b7f46; --warn: #8a5a00;
    --glow1: rgba(95, 150, 215, .50); --glow2: rgba(255, 255, 255, .95); --glow3: rgba(140, 165, 215, .42);
    --glass-shadow: 0 10px 34px rgba(50, 70, 110, .16); --glass-hi: inset 0 1px 0 rgba(255, 255, 255, .9);
    color-scheme: light;
  }
}
:root[data-theme="dark"] {
  --bg: #090b10; --surface: rgba(255, 255, 255, .065); --surface-2: rgba(255, 255, 255, .10);
  --input-bg: rgba(255, 255, 255, .07); --band: rgba(255, 255, 255, .035); --nav-bg: rgba(10, 12, 18, .58);
  --line: rgba(255, 255, 255, .14); --fg: #eef1f5; --muted: #a3acb8; --silver: #cdd2db; --road: #7fa8d1;
  --btn-bg: #e9ecf1; --btn-fg: #0d1016; --wa: #25a05a; --warn: #e8ae5e;
  --glow1: rgba(86, 132, 190, .38); --glow2: rgba(205, 210, 219, .10); --glow3: rgba(70, 96, 150, .30);
  --glass-shadow: 0 10px 34px rgba(0, 0, 0, .38); --glass-hi: inset 0 1px 0 rgba(255, 255, 255, .12);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #e8ecf2; --surface: rgba(255, 255, 255, .58); --surface-2: rgba(255, 255, 255, .78);
  --input-bg: rgba(255, 255, 255, .82); --band: rgba(255, 255, 255, .35); --nav-bg: rgba(238, 241, 246, .66);
  --line: rgba(30, 45, 80, .13); --fg: #12161c; --muted: #4f5a6a; --silver: #3a4350; --road: #2b5f95;
  --btn-bg: #12161c; --btn-fg: #eef1f5; --wa: #1b7f46; --warn: #8a5a00;
  --glow1: rgba(95, 150, 215, .50); --glow2: rgba(255, 255, 255, .95); --glow3: rgba(140, 165, 215, .42);
  --glass-shadow: 0 10px 34px rgba(50, 70, 110, .16); --glass-hi: inset 0 1px 0 rgba(255, 255, 255, .9);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.85;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 50; background: var(--bg);
}
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.4; }

.wrap {
  max-width: 1080px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  background: var(--nav-bg); border-bottom: 1px solid var(--line);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(1.6); backdrop-filter: blur(var(--blur)) saturate(1.6);
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; }
.brand img { width: 40px; height: 40px; border-radius: 50%; flex: none; }
.brand b { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; white-space: nowrap; }
.nav { display: flex; align-items: center; gap: 20px; }
.nav a.link { color: var(--muted); text-decoration: none; font-size: .95rem; }
.nav a.link:hover { color: var(--fg); }
@media (max-width: 640px) { .nav a.link { display: none; } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 8px 22px; border-radius: 999px;
  font-family: var(--font-body); font-weight: 600; font-size: 1rem; line-height: 1.2;
  text-decoration: none; border: 1px solid transparent; cursor: pointer;
  background: var(--btn-bg); color: var(--btn-fg);
  transition: transform .15s ease, background-color .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .55; cursor: default; transform: none; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--silver); }
.btn.danger { background: transparent; color: var(--warn); border-color: var(--warn); }
.btn.small { min-height: 38px; padding: 6px 16px; font-size: .92rem; }
:focus-visible { outline: 2px solid var(--road); outline-offset: 3px; }

/* hero */
.hero .wrap {
  display: grid; grid-template-columns: 1.25fr 1fr; align-items: center; gap: 40px;
  padding-block: 56px 64px;
}
.hero-copy { min-width: 0; display: flex; flex-direction: column; gap: 20px; align-items: flex-start; }
.latin {
  font-family: var(--font-latin); font-weight: 600; letter-spacing: .22em;
  text-transform: uppercase; font-size: .9rem; color: var(--silver); direction: ltr;
}
.hero h1 { font-size: clamp(2.1rem, 7.5vw, 3.7rem); font-weight: 700; }
.hero h1 span { color: var(--road); }
.hero p.lead { font-size: 1.1rem; color: var(--muted); max-width: 34em; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--muted); font-size: .92rem; }
.meta span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--road); margin-inline-end: 8px; }
.disc { justify-self: center; position: relative; width: min(100%, 330px); aspect-ratio: 1; }
.disc img {
  width: 100%; height: 100%; border-radius: 50%; display: block;
  box-shadow: 0 0 0 1px var(--line), 0 0 0 10px var(--bg), 0 0 0 11px var(--silver), 0 30px 80px rgba(0,0,0,.35);
}
@media (max-width: 760px) {
  .hero .wrap { grid-template-columns: 1fr; padding-block: 36px 44px; gap: 32px; }
  .disc { order: -1; width: min(70%, 240px); }
  .hero-copy { align-items: stretch; }
  .hero-actions .btn { flex: 1 1 160px; }
}

.route {
  height: 2px; opacity: .45;
  background: repeating-linear-gradient(to left, var(--silver) 0 16px, transparent 16px 32px);
}

section { scroll-margin-top: calc(70px + env(safe-area-inset-top, 0px)); }
.block .wrap { padding-block: 64px; display: flex; flex-direction: column; gap: 32px; }
.head { display: flex; flex-direction: column; gap: 8px; }
.head h2 { font-size: clamp(1.6rem, 5vw, 2.3rem); font-weight: 600; }
.head p { color: var(--muted); max-width: 40em; }

/* services */
.services { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px 28px; }
.svc { min-width: 0; padding-top: 16px; border-top: 1px solid var(--silver); display: flex; flex-direction: column; gap: 6px; }
.svc h3 { font-size: 1.2rem; font-weight: 600; }
.svc p { color: var(--muted); font-size: .98rem; }
@media (max-width: 640px) { .services { grid-template-columns: 1fr; } }

/* prices */
.why { background: var(--band); border-block: 1px solid var(--line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.fleet { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.car { min-width: 0; padding: 20px; border-radius: 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 4px; }
.car b { font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; }
.car .cap { color: var(--muted); font-size: .94rem; }
.car .rate { margin-top: 10px; padding-top: 12px; border-top: 1px dashed var(--line); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.car .rate strong { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1.2; color: var(--road); font-variant-numeric: tabular-nums; }
.car .rate small { color: var(--muted); font-size: .92rem; }

/* why */
.checks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; list-style: none; margin: 0; padding: 0; }
.checks li {
  min-width: 0; padding: 20px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 8px;
}
.checks svg { width: 26px; height: 26px; stroke: var(--road); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.checks b { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
.checks span { color: var(--muted); font-size: .96rem; }
@media (max-width: 760px) { .checks { grid-template-columns: 1fr; } }

/* showcase */
.shots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.shots figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.shots img { width: 100%; height: auto; display: block; border-radius: 12px; border: 1px solid var(--line); aspect-ratio: 1080 / 588; object-fit: cover; }
.shots figcaption { color: var(--muted); font-size: .92rem; }
@media (max-width: 640px) { .shots { grid-template-columns: 1fr; } }

/* offer */
.offer .wrap { padding-block: 0; }
.offer-card {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px;
  padding: 28px; border-radius: 18px; border: 1px solid var(--silver);
  background: linear-gradient(120deg, var(--surface) 0%, var(--surface-2) 100%);
}
.offer-card > div { min-width: 0; flex: 1 1 280px; display: flex; flex-direction: column; gap: 6px; }
.offer-card h2 { font-size: clamp(1.4rem, 4.5vw, 2rem); font-weight: 600; }
.offer-card h2 b { color: var(--road); font-weight: 700; }
.offer-card p { color: var(--muted); }

/* forms */
.book-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: .92rem; color: var(--muted); }
.field input, .field select, .field textarea {
  width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.6;
}
.field textarea { min-height: 84px; resize: vertical; }
.field input::placeholder, .field textarea::placeholder { color: var(--muted); opacity: .8; }
.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible { border-color: var(--road); outline-offset: 1px; }
.book-actions { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.book-actions .btn.wa { background: var(--wa); color: #fff; }
.note { color: var(--muted); font-size: .9rem; }
@media (max-width: 640px) { .book-grid { grid-template-columns: 1fr; } .book-actions .btn { align-self: stretch; } }

.sub { grid-column: 1 / -1; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; color: var(--silver); padding-top: 14px; border-top: 1px solid var(--line); margin-top: 6px; }
.sub:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.field .opt { color: var(--muted); font-size: .82rem; }
.field input[readonly] { color: var(--muted); background: var(--surface-2); }
.field input.ltr { direction: ltr; text-align: right; }
.info { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); border-inline-start: 3px solid var(--road); }
.info b { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
.info span { color: var(--muted); font-size: .92rem; }
.info .est { color: var(--fg); font-weight: 500; }
.info.warn { border-inline-start-color: var(--warn); }
.info.warn #carNote { color: var(--warn); }
.msg { color: var(--warn); font-size: .92rem; min-height: 1.4em; }

/* map picking */
.full-note { grid-column: 1 / -1; }
.locrow { display: flex; flex-wrap: wrap; gap: 8px; }
.locrow input { flex: 1 1 200px; min-width: 0; }
.locrow .mapbtn { flex: none; min-height: 48px; }
.hint { color: var(--muted); font-size: .86rem; min-height: 1.2em; }
.dir { gap: 6px; align-items: flex-start; }
.dir .btn[aria-disabled="true"] { opacity: .5; cursor: default; }
.hint.state-ok { color: var(--road); }

/* contact */
.contact { background: var(--band); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.card { min-width: 0; padding: 20px; border-radius: 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; }
.card.wide { grid-column: 1 / -1; }
.card small { color: var(--muted); font-size: .88rem; }
.card .val { font-size: 1.15rem; font-weight: 500; overflow-wrap: anywhere; }
.card .val.ltr { direction: ltr; text-align: right; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.card .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
@media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }

footer .wrap { padding-block: 28px 32px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; color: var(--muted); font-size: .9rem; }
.adm-link { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }

/* admin */
.adm-main .wrap { padding-block: 28px 40px; display: flex; flex-direction: column; gap: 24px; }
.panel { min-width: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.panel h1 { font-size: 1.6rem; font-weight: 600; }
.panel h2 { font-size: 1.3rem; font-weight: 600; }
.auth { max-width: 460px; margin: 24px auto; width: 100%; }
.arow { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 12px; align-items: end; padding: 14px; border-radius: 12px; background: var(--surface-2); }
.arow .btn { align-self: end; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; padding: 14px; border-radius: 12px; background: var(--surface-2); }
.srow .field.full { grid-column: 1 / -1; }
.srow .btn { align-self: start; margin-top: 26px; }
.set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.hint { color: var(--muted); font-size: .86rem; }
.savebar { position: sticky; bottom: 0; z-index: 40; background: var(--nav-bg); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.6); backdrop-filter: blur(var(--blur)) saturate(1.6); }
.savebar .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.savebar .row { display: flex; flex-wrap: wrap; gap: 10px; }
.state-ok { color: var(--road); }
.state-warn { color: var(--warn); }
@media (max-width: 760px) {
  .arow { grid-template-columns: 1fr 1fr; }
  .arow .field:first-child { grid-column: 1 / -1; }
  .arow .btn { grid-column: 1 / -1; }
  .set-grid { grid-template-columns: 1fr; }
  .srow .btn { margin-top: 0; }
}

/* glass */
.orbs {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(52rem 38rem at 88% -8%, var(--glow1), transparent 62%),
    radial-gradient(46rem 34rem at -6% 38%, var(--glow3), transparent 62%),
    radial-gradient(40rem 30rem at 104% 92%, var(--glow2), transparent 62%);
}
.car, .checks li, .card, .offer-card, .panel, .info {
  border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--glass-shadow), var(--glass-hi);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(1.5); backdrop-filter: blur(var(--blur)) saturate(1.5);
}
.info { border-radius: 14px; border-inline-start: 3px solid var(--road); }
.arow, .srow { border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--glass-hi); }
.field input, .field select, .field textarea { background: var(--input-bg); }
.btn.ghost { background: var(--surface); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: var(--glass-hi); }
.shots img { box-shadow: var(--glass-shadow); }
.theme-btn { width: 40px; min-height: 40px; height: 40px; padding: 0; border-radius: 50%; flex: none; }
.theme-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic-moon { display: none; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) .ic-sun { display: none; }
  :root:not([data-theme="dark"]) .ic-moon { display: inline; }
}
:root[data-theme="light"] .ic-sun { display: none; }
:root[data-theme="light"] .ic-moon { display: inline; }
:root[data-theme="dark"] .ic-sun { display: inline; }
:root[data-theme="dark"] .ic-moon { display: none; }

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .btn { transition: none; } .btn:hover { transform: none; } }

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toLatin(s) {
    return String(s == null ? "" : s)
      .replace(/[٠-٩]/g, function (d) { return String(d.charCodeAt(0) - 0x0660); })
      .replace(/[۰-۹]/g, function (d) { return String(d.charCodeAt(0) - 0x06F0); })
      .replace(/٫/g, ".");
  }
  function normPhone(s) {
    var d = toLatin(s).replace(/\D/g, "");
    if (d.indexOf("20") === 0 && d.length === 12) d = "0" + d.slice(2);
    if (d.length === 10 && d.charAt(0) === "1") d = "0" + d;
    return d;
  }
  function validPhone(p) { return /^01[0125]\d{8}$/.test(p); }
  function intl(local) { return "20" + String(local).slice(1); }

      } else {
        dl.href = "#"; dl.setAttribute("aria-disabled", "true");
        dn.textContent = shortLink ? "رابط الموقع المختصر مش بيظهر في المسار. لو عايز تشوف المسافة اكتب العنوان أو الإحداثيات." : "اكتب نقطة الانطلاق والوصول عشان يظهر المسار.";
      }
      return P;
    }

    function refresh() {
      var pax = Math.round(num("f-pax") || 0), bags = num("f-bags"), km = num("f-km");
      var car = pickCar(pax), warn = false, note = "", rate = "", est = "";
      if (!car) {
        carName.textContent = "—";
        if (pax > maxPax) { note = "أكتر من " + maxPax + " فرد: كلمنا على واتساب نرتب لك أكتر من سيارة."; warn = true; }
        else note = "اكتب عدد الأفراد.";
      } else {
        carName.textContent = car.name;
        note = bagsText(car);
        if (car.bagLimit != null && bags != null && bags > car.bagLimit) {
          note = "الحقائب أكتر من الحد (" + car.bagLimit + "). كلمنا على واتساب نرتب لك سيارة أنسب.";
          warn = true;
        }
        rate = car.pricePerKm != null ? "سعر الكيلو: " + fmtNum(car.pricePerKm) + " جنيه" : "سعر الكيلو يتحدد عند الحجز";
        if (car.pricePerKm != null && km && km > 0) est = "التكلفة التقريبية: " + Math.round(km * car.pricePerKm) + " جنيه (تقديرية)";
      }
      carNote.textContent = note; carRate.textContent = rate; carEst.textContent = est;
      carBox.classList.toggle("warn", warn);
      var d = parseDate(), dn = "";
      if (d) { try { dn = "(" + d.toLocaleDateString("ar-EG", { weekday: "long" }) + ")"; } catch (e) {} }
      dayName.textContent = dn;
      return { car: car, est: est, km: km };
    }

    function missing() {
      var out = [];
      if (!val("f-name")) out.push("اسم العميل");
      if (!val("f-phone")) out.push("رقم الهاتف");
      if (!val("f-from")) out.push("نقطة الانطلاق");
      if (!val("f-to")) out.push("نقطة الوصول");
      if (!(num("f-pax") > 0)) out.push("عدد الأفراد");
      if (!val("f-date")) out.push("التاريخ");
      if (!val("f-time")) out.push("الساعة");
      return out;
    }

    function build() {
      var r = refresh();
      var P = updateMaps();
      var L = ["طلب حجز جديد - Route X Limousine", ""];
      L.push("الاسم: " + val("f-name"));
      L.push("رقم الهاتف: " + val("f-phone"));
      if (val("f-phone2")) L.push("هاتف بديل: " + val("f-phone2"));
      L = L.concat(locLines("نقطة الانطلاق", P.from), locLines("نقطة إضافية", P.via), locLines("نقطة الوصول", P.to));
      L.push("عدد الأفراد: " + val("f-pax"));
      if (r.car) {
        L.push("السيارة: " + r.car.name);
        if (r.car.pricePerKm != null) L.push("سعر الكيلو: " + fmtNum(r.car.pricePerKm) + " جنيه");
      }
      L.push("عدد الحقائب: " + (val("f-bags") || "0"));
      if (r.km && r.km > 0) L.push("المسافة التقريبية: " + fmtNum(r.km) + " كم");
      if (r.est) L.push(r.est);
      L.push("وقت الانطلاق: " + [dateText(), timeText()].filter(Boolean).join(" - "));
      L.push("الوقت المقدر للوصول: يتحدد بعد تأكيد المسار");
      link.href = "https://wa.me/" + NUMBER + "?text=" + encodeURIComponent(L.join("\n"));
    }

    ["f-name", "f-phone", "f-phone2", "f-from", "f-via", "f-km", "f-to", "f-pax", "f-bags", "f-date", "f-time"].forEach(function (id) {
      var el = $(id);
      el.addEventListener("input", function () { msg.textContent = ""; build(); });
      el.addEventListener("change", build);
    });
    form.addEventListener("submit", function (e) { e.preventDefault(); });
    $("dirLink").addEventListener("click", function (e) { if (this.getAttribute("aria-disabled") === "true") e.preventDefault(); });
    link.addEventListener("click", function (e) {
      var m = missing();
      if (m.length) { e.preventDefault(); msg.textContent = "كمّل البيانات دي الأول: " + m.join("، "); }
      else msg.textContent = "";
    });
    build();

    document.querySelectorAll("[data-copy]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var target = $(btn.getAttribute("data-copy"));
        var text = target.textContent.trim(), original = btn.textContent;
        function done() { btn.textContent = "تم النسخ"; setTimeout(function () { btn.textContent = original; }, 1800); }
        function fallback() {
          var range = document.createRange(); range.selectNodeContents(target);
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
        }
        try { navigator.clipboard.writeText(text).then(done, fallback); } catch (err) { fallback(); }
      });
    });
  }

  function renderSite() {
    app.innerHTML = siteHtml();
    bindSite();
  }

  /* ---------- admin ---------- */
  var draft = null, adm = null, failCount = 0, lockUntil = 0;

  function adminShell(inner, extra) {
    return '<div dir="rtl" lang="ar"><div class="orbs" aria-hidden="true"></div>' +
      '<header class="top"><div class="wrap">' +
        '<a class="brand" href="#top"><img src="' + IMG.logo + '" alt="" width="40" height="40"><b>Route X · الإدارة</b></a>' +
        '<div class="row" style="display:flex;gap:8px;align-items:center">' + themeBtn() + (extra || "") + '<a class="btn small ghost" href="#top">رجوع للموقع</a></div>' +
      '</div></header>' + inner + '</div>';
  }
  function loggedIn() {
    try { return !!state.admin && sessionStorage.getItem(SESS) === state.admin.hash; } catch (e) { return false; }
  }
  function setSession(h) { try { sessionStorage.setItem(SESS, h); } catch (e) {} }
  function clearSession() { try { sessionStorage.removeItem(SESS); } catch (e) {} }

  function authHtml(setup) {
    return adminShell('<main class="adm-main"><div class="wrap">' +
      '<form class="panel auth" id="authForm" novalidate>' +
        '<h1>' + (setup ? 'إنشاء حساب المدير' : 'دخول الإدارة') + '</h1>' +
        (setup ? '<p class="note">ده أول دخول للوحة الإدارة. اكتب رقم موبايل المدير وكلمة مرور جديدة.</p>' : '<p class="note">اكتب رقم الموبايل وكلمة المرور.</p>') +
        '<div class="field"><label for="a-phone">رقم الموبايل</label><input id="a-phone" class="ltr" type="tel" inputmode="tel" autocomplete="username" placeholder="01xxxxxxxxx"></div>' +
        '<div class="field"><label for="a-pw">كلمة المرور' + (setup ? ' <span class="opt">(8 حروف على الأقل)</span>' : '') + '</label><input id="a-pw" class="ltr" type="password" autocomplete="' + (setup ? 'new-password' : 'current-password') + '"></div>' +
        (setup ? '<div class="field"><label for="a-pw2">تأكيد كلمة المرور</label><input id="a-pw2" class="ltr" type="password" autocomplete="new-password"></div>' : '') +
        '<p class="msg" id="authMsg" role="alert"></p>' +
        '<button class="btn" type="submit" id="authBtn">' + (setup ? 'إنشاء الحساب وحفظه' : 'دخول') + '</button>' +
        (setup ? '<p class="hint">الحفظ بيتم من حساب Claude صاحب الصفحة، ومش بيشتغل لأي حد تاني.</p>' : '') +
      '</form></div></main>');
  }

  function bindAuth(setup) {
    var form = $("authForm"), msg = $("authMsg"), btn = $("authBtn");
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      msg.textContent = "";
      if (!hasCrypto()) { msg.textContent = "المتصفح ده مش بيدعم التشفير المطلوب. جرب متصفح أحدث."; return; }
      var phone = normPhone($("a-phone").value), pw = $("a-pw").value;
      if (!validPhone(phone)) { msg.textContent = "اكتب رقم موبايل مصري صحيح (11 رقم)."; return; }
      if (setup) {
        if (pw.length < 8) { msg.textContent = "كلمة المرور لازم تكون 8 حروف على الأقل."; return; }
        if (pw !== $("a-pw2").value) { msg.textContent = "كلمتي المرور مش متطابقتين."; return; }
        btn.disabled = true; msg.textContent = "جارٍ الحفظ...";
        try {
          var salt = newSalt(), hash = await hashPw(pw, salt);
          var next = clone(state); next.admin = { phone: phone, salt: salt, hash: hash };
          setSession(hash);
          await publishState(next);
          msg.textContent = "تم الحفظ، الصفحة بتتحدث...";
        } catch (err) {
          clearSession(); btn.disabled = false; msg.textContent = saveErrorText(err);
        }
      } else {
        var now = Date.now();
        if (now < lockUntil) { msg.textContent = "محاولات كتير غلط. استنى " + Math.ceil((lockUntil - now) / 1000) + " ثانية."; return; }
        btn.disabled = true;
        try {
          var h = await hashPw(pw, state.admin.salt);
          if (phone === state.admin.phone && h === state.admin.hash) {
            failCount = 0; setSession(h); route(true, true);
            return;
          }
        } catch (err) {}
        failCount++;
        if (failCount >= 5) { lockUntil = Date.now() + 30000; failCount = 0; }
        btn.disabled = false;
        msg.textContent = "رقم الموبايل أو كلمة المرور غلط.";
      }
    });
  }

  function fld(label, id, kind, i, f, v, isNum, mode, ph) {
    return '<div class="field"><label for="' + id + '">' + label + '</label>' +
      '<input id="' + id + '" type="text" ' + (mode ? 'inputmode="' + mode + '" ' : '') + (ph ? 'placeholder="' + esc(ph) + '" ' : '') +
      'data-kind="' + kind + '" data-i="' + i + '" data-f="' + f + '"' + (isNum ? ' data-num="1"' : '') + ' value="' + esc(v == null ? "" : v) + '"></div>';
  }
  function carRow(c, i) {
    var b = "cars-" + i + "-";
    return '<div class="arow">' +
      fld("اسم السيارة", b + "name", "cars", i, "name", c.name, false) +
      fld("أقصى عدد أفراد", b + "maxPax", "cars", i, "maxPax", c.maxPax, true, "numeric") +
      fld("سعر الكيلو (جنيه)", b + "price", "cars", i, "pricePerKm", c.pricePerKm, true, "decimal", "فاضي = عند الحجز") +
      fld("حد الحقائب", b + "bags", "cars", i, "bagLimit", c.bagLimit, true, "numeric", "فاضي = بدون") +
      '<button class="btn small danger" type="button" data-act="del" data-kind="cars" data-i="' + i + '">حذف</button></div>';
  }
  function svcRow(s, i) {
    var b = "services-" + i + "-";
    return '<div class="srow">' +
      '<div class="field">' + '<label for="' + b + 'title">اسم الخدمة</label><input id="' + b + 'title" type="text" data-kind="services" data-i="' + i + '" data-f="title" value="' + esc(s.title) + '"></div>' +
      '<button class="btn small danger" type="button" data-act="del" data-kind="services" data-i="' + i + '">حذف</button>' +
      '<div class="field full"><label for="' + b + 'desc">وصف الخدمة</label><textarea id="' + b + 'desc" rows="2" data-kind="services" data-i="' + i + '" data-f="desc">' + esc(s.desc) + '</textarea></div>' +
    '</div>';
  }
  function dashHtml() {
    return adminShell(
      '<main class="adm-main"><div class="wrap">' +
        '<section class="panel"><h2>السيارات والأسعار</h2>' +
          '<p class="note">السيارة بتتحدد للعميل حسب عدد الأفراد: أصغر سيارة تكفي العدد. الأسعار بالجنيه المصري للكيلومتر.</p>' +
          draft.cars.map(carRow).join("") +
          '<div><button class="btn small ghost" type="button" data-act="add-car">إضافة سيارة</button></div>' +
        '</section>' +
        '<section class="panel"><h2>الخدمات</h2>' +
          draft.services.map(svcRow).join("") +
          '<div><button class="btn small ghost" type="button" data-act="add-svc">إضافة خدمة</button></div>' +
        '</section>' +
        '<section class="panel"><h2>الإعدادات</h2>' +
          '<div class="set-grid">' +
            fld("رقم واتساب استقبال الطلبات", "set-wa", "settings", 0, "whatsapp", draft.settings.whatsapp, false, "tel") +
            '<div class="field"><label for="adm-phone">رقم موبايل المدير (لتسجيل الدخول)</label><input id="adm-phone" class="ltr" type="tel" inputmode="tel" value="' + esc(adm.phone) + '"></div>' +
            '<div class="field"><label for="adm-pw">كلمة مرور جديدة <span class="opt">(سيبها فاضية لو مش هتغيرها)</span></label><input id="adm-pw" class="ltr" type="password" autocomplete="new-password"></div>' +
            '<div class="field"><label for="adm-pw2">تأكيد كلمة المرور الجديدة</label><input id="adm-pw2" class="ltr" type="password" autocomplete="new-password"></div>' +
          '</div>' +
          '<p class="hint">الحفظ بيتم من حساب Claude صاحب الصفحة أو حساب عنده صلاحية تعديل.</p>' +
        '</section>' +
      '</div></main>' +
      '<div class="savebar"><div class="wrap"><span class="note" id="saveState" role="status">مفيش تعديلات.</span>' +
        '<div class="row"><button class="btn ghost small" type="button" data-act="reset">تراجع عن التعديلات</button><button class="btn small" type="button" data-act="save" id="saveBtn">حفظ ونشر</button></div>' +
      '</div></div>',
      '<button class="btn small ghost" type="button" data-act="logout">خروج</button>');
  }

  function setSaveState(text, cls) {
    var el = $("saveState"); if (!el) return;
    el.textContent = text; el.className = "note" + (cls ? " " + cls : "");
  }
  function markDirty() { setSaveState("فيه تعديلات لسه ما اتحفظتش.", "state-warn"); }

  function validateDraft() {
    if (!draft.cars.length) return "لازم تسيب سيارة واحدة على الأقل.";
    for (var i = 0; i < draft.cars.length; i++) {
      var c = draft.cars[i], n = i + 1;
      if (!String(c.name || "").trim()) return "اكتب اسم السيارة رقم " + n + ".";
      if (!(c.maxPax >= 1) || Math.round(c.maxPax) !== c.maxPax) return "أقصى عدد أفراد للسيارة رقم " + n + " لازم يكون رقم صحيح من 1 فوق.";
      if (c.pricePerKm != null && !(c.pricePerKm >= 0)) return "سعر الكيلو للسيارة رقم " + n + " غير صحيح.";
      if (c.bagLimit != null && (!(c.bagLimit >= 0) || Math.round(c.bagLimit) !== c.bagLimit)) return "حد الحقائب للسيارة رقم " + n + " غير صحيح.";
    }
    for (var j = 0; j < draft.services.length; j++) {
      if (!String(draft.services[j].title || "").trim()) return "اكتب اسم الخدمة رقم " + (j + 1) + " أو احذفها.";
    }
    if (!validPhone(normPhone(draft.settings.whatsapp))) return "رقم واتساب الطلبات لازم يكون رقم موبايل مصري صحيح.";
    if (!validPhone(normPhone(($("adm-phone") || {}).value))) return "رقم موبايل المدير لازم يكون رقم مصري صحيح.";
    var pw = ($("adm-pw") || {}).value || "", pw2 = ($("adm-pw2") || {}).value || "";
    if (pw || pw2) {
      if (pw.length < 8) return "كلمة المرور الجديدة لازم تكون 8 حروف على الأقل.";
      if (pw !== pw2) return "كلمتي المرور الجديدتين مش متطابقتين.";
    }
    return "";
  }

  async function saveDraft() {
    var err = validateDraft();
    if (err) { setSaveState(err, "state-warn"); return; }
    var btn = $("saveBtn"); btn.disabled = true; setSaveState("جارٍ الحفظ...", "");
    var prevHash = state.admin.hash;
    try {
      var next = {
        v: 1,
        settings: { whatsapp: normPhone(draft.settings.whatsapp) },
        admin: { phone: normPhone($("adm-phone").value), salt: state.admin.salt, hash: state.admin.hash },
        cars: draft.cars.map(function (c) {
          return { id: c.id || uid(), name: String(c.name).trim(), maxPax: c.maxPax, pricePerKm: c.pricePerKm == null ? null : c.pricePerKm, bagLimit: c.bagLimit == null ? null : c.bagLimit };
        }).sort(function (a, b) { return a.maxPax - b.maxPax; }),
        services: draft.services.map(function (s) {
          return { id: s.id || uid(), title: String(s.title).trim(), desc: String(s.desc || "").trim() };
        })
      };
      var pw = $("adm-pw").value;
      if (pw) {
        if (!hasCrypto()) throw { code: "x" };
        var salt = newSalt(), hash = await hashPw(pw, salt);
        next.admin = { phone: next.admin.phone, salt: salt, hash: hash };
      }
      setSession(next.admin.hash);
      await publishState(next);
      setSaveState("تم الحفظ، الصفحة بتتحدث...", "state-ok");
    } catch (e) {
      setSession(prevHash);
      btn.disabled = false;
      setSaveState(saveErrorText(e), "state-warn");
    }
  }

  function bindDash() {
    var root = app;
    root.addEventListener("input", function (e) {
      var t = e.target, k = t.getAttribute && t.getAttribute("data-kind");
      if (!k) { if (t.id && t.id.indexOf("adm-") === 0) markDirty(); return; }
      var f = t.getAttribute("data-f"), i = +t.getAttribute("data-i"), v = t.value;
      if (t.getAttribute("data-num") === "1") {
        v = v.trim() === "" ? null : parseFloat(toLatin(v));
        if (v != null && isNaN(v)) v = null;
      }
      if (k === "settings") draft.settings[f] = v; else draft[k][i][f] = v;
      markDirty();
    });
    root.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("[data-act]") : null;
      if (!b) return;
      var act = b.getAttribute("data-act");
      if (act === "save") { saveDraft(); return; }
      if (act === "reset") { draft = clone({ cars: state.cars, services: state.services, settings: state.settings }); renderDash(); return; }
      if (act === "logout") { clearSession(); route(true, true); return; }
      if (act === "add-car") { draft.cars.push({ id: uid(), name: "", maxPax: null, pricePerKm: null, bagLimit: null }); renderDash(true); return; }
      if (act === "add-svc") { draft.services.push({ id: uid(), title: "", desc: "" }); renderDash(true); return; }
      if (act === "del") {
        if (b.getAttribute("data-armed") !== "1") {
          b.setAttribute("data-armed", "1"); b.textContent = "تأكيد الحذف";
          setTimeout(function () { if (b.isConnected) { b.removeAttribute("data-armed"); b.textContent = "حذف"; } }, 3000);
          return;
        }
        draft[b.getAttribute("data-kind")].splice(+b.getAttribute("data-i"), 1);
        renderDash(true);
      }
    });
  }

  function renderDash(dirty) {
    var keep = { phone: ($("adm-phone") || {}).value, pw: ($("adm-pw") || {}).value, pw2: ($("adm-pw2") || {}).value, wa: draft.settings.whatsapp };
    app.innerHTML = dashHtml();
    if (keep.phone != null) { $("adm-phone").value = keep.phone; $("adm-pw").value = keep.pw || ""; $("adm-pw2").value = keep.pw2 || ""; }
    if (dirty) markDirty();
  }

  function renderAdmin() {
    if (!state.admin) { app.innerHTML = authHtml(true); bindAuth(true); return; }
    if (!loggedIn()) { app.innerHTML = authHtml(false); bindAuth(false); return; }
    adm = { phone: state.admin.phone };
    draft = clone({ cars: state.cars, services: state.services, settings: state.settings });
    app.innerHTML = dashHtml();
    bindDash();
  }

  /* ---------- routing ---------- */
  var mode = null;
  function route(force, scroll) {
    var m = "site";
    if (!force && m === mode) return;
    var first = mode === null;
    mode = m;
    if (m === "admin") {
      app.replaceWith && 0;
      var fresh = app.cloneNode(false); app.parentNode.replaceChild(fresh, app); app = fresh;
      renderAdmin();
    } else {
      var fresh2 = app.cloneNode(false); app.parentNode.replaceChild(fresh2, app); app = fresh2;
      renderSite();
    }
    if (first && m === "site" && location.hash.length > 1) {
      var el = document.getElementById(location.hash.slice(1));
      if (el && el.scrollIntoView) el.scrollIntoView();
    } else if (!first || scroll) {
      window.scrollTo(0, 0);
    }
  }
  window.addEventListener("hashchange", function () { route(false); });
  route(true);
})();
</script>

</body>
