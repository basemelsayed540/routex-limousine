<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMin slice" role="img" aria-label="سيارة ميني فان">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a44"/><stop offset=".62" stop-color="#101827"/><stop offset="1" stop-color="#090d14"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".55">
      <stop offset="0" stop-color="#5f86c4" stop-opacity=".45"/><stop offset="1" stop-color="#5f86c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edf3"/><stop offset=".45" stop-color="#bcc5d3"/><stop offset="1" stop-color="#6d7788"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb0d8" stop-opacity=".9"/><stop offset="1" stop-color="#1a2438" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="rim" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#f3f5f9"/><stop offset="1" stop-color="#7d8798"/>
    </radialGradient>
    <g id="wheel">
      <circle r="50" fill="#07090d"/>
      <circle r="41" fill="#14171d"/>
      <circle r="28" fill="url(#rim)"/>
      <g stroke="#3b4352" stroke-width="5" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-24"/><line x1="0" y1="0" x2="23" y2="-7"/>
        <line x1="0" y1="0" x2="14" y2="19"/><line x1="0" y1="0" x2="-14" y2="19"/><line x1="0" y1="0" x2="-23" y2="-7"/>
      </g>
      <circle r="6" fill="#1b202a"/>
    </g>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow)"/>
  <rect y="338" width="800" height="112" fill="#0b0f17"/>
  <rect y="338" width="800" height="2" fill="#2a3550" opacity=".7"/>
  <ellipse cx="400" cy="342" rx="350" ry="16" fill="#000" opacity=".6"/>
  <!-- body -->
  <path d="M66 306 L66 236 C66 204 80 170 106 156 C122 148 140 146 160 146 L520 146 C566 148 598 170 628 206 L700 232 C726 240 740 256 740 284 L740 306 Z" fill="url(#body)"/>
  <path d="M160 146 L520 146 C566 148 598 170 628 206 L700 232" fill="none" stroke="#ffffff" stroke-width="2" opacity=".8"/>
  <!-- glass -->
  <path d="M120 206 L120 172 C124 164 136 160 156 160 L318 160 L318 206 Z" fill="url(#glass)"/>
  <path d="M330 160 L470 160 L470 206 L330 206 Z" fill="url(#glass)"/>
  <path d="M482 160 L522 160 C552 162 578 180 604 206 L482 206 Z" fill="url(#glass)"/>
  <!-- door lines (sliding door) -->
  <g stroke="#5b6475" stroke-width="2" opacity=".9" fill="none">
    <path d="M324 160 L324 298"/><path d="M476 160 L476 298"/><path d="M324 232 L476 232"/>
    <path d="M114 206 L106 298"/>
  </g>
  <path d="M110 262 L700 262" stroke="#7b8598" stroke-width="2" opacity=".6"/>
  <rect x="438" y="240" width="26" height="5" rx="2.5" fill="#6d7788"/>
  <rect x="504" y="240" width="26" height="5" rx="2.5" fill="#6d7788"/>
  <!-- lights -->
  <path d="M708 250 L736 258 L735 268 L704 264 Z" fill="#fffdf2"/>
  <path d="M708 250 L736 258" stroke="#ffd98a" stroke-width="3"/>
  <path d="M68 226 L84 220 L88 252 L67 256 Z" fill="#e0243a"/>
  <rect x="68" y="294" width="672" height="6" fill="#4d5463" opacity=".8"/>
  <!-- wheels -->
  <circle cx="212" cy="296" r="56" fill="#06080c"/>
  <circle cx="598" cy="296" r="56" fill="#06080c"/>
  <use href="#wheel" x="212" y="296"/>
  <use href="#wheel" x="598" y="296"/>
